<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>지도 테스트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { width: 100vw; height: 100vh; background: #ddd; }
    </style>
</head>
<body>
<div id="map" style="width: 100%; height: 600px;"></div>

<script>
    var map = L.map('map').setView([35.15, 128.60], 12);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    fetch('{{ site.baseurl }}/assets/places.json')
        .then(response => response.json())
        .then(data => {
            console.log("불러온 데이터:", data); // 데이터를 제대로 가져왔는지 확인

            data.forEach((item, index) => {
                // 데이터 키값 확인: JSON 파일의 키와 대소문자까지 똑같아야 합니다.
                var lat = parseFloat(item.lat);
                var lng = parseFloat(item.lng);
                
                console.log(`마커 ${index} 생성 시도:`, lat, lng); // 좌표값이 숫자로 나오는지 확인

                if (!isNaN(lat) && !isNaN(lng)) {
                    L.marker([lat, lng]).addTo(map)
                     .bindPopup(`<b>${item.place}</b>`);
                } else {
                    console.error(`마커 ${index} 좌표 오류:`, item);
                }
            });
        })
        .catch(e => console.error("JSON 로드 실패:", e));
</script>
</body>
</html>
