---
layout: compress
---

{% include head.html %}

<main>

    {% include header.html %}

    <article>
        <h1>{{ page.title }}</h1>
        {{ content }}
    </article>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map {
            width: 100%;
            height: 600px;
            z-index: 1;
        }
        .popup-img {
            width: 100%;
            max-width: 200px;
            height: auto;
            display: block;
            margin-top: 5px;
        }
    </style>
<div id="map" style="width: 100%; height: 600px;"></div>

<script>
    // 1. 지도 초기화 함수
    function initMap() {
        // Leaflet이 정상적으로 로드되었는지 확인
        if (typeof L === 'undefined') {
            console.error("Leaflet 라이브러리를 찾을 수 없습니다.");
            return;
        }

        const map = L.map('map').setView([35.15, 128.60], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 2. 데이터 가져오기 (파일이 없어도 지도 초기화는 완료됨)
        fetch('{{ site.baseurl }}/assets/js/places.json')
            .then(response => {
                if (!response.ok) throw new Error("JSON 파일이 없거나 경로가 잘못되었습니다.");
                return response.json();
            })
            .then(placeData => {
                placeData.forEach(item => {
                    L.marker([item.lat, item.lng]).addTo(map)
                     .bindPopup(`
                        <div>
                            <h3>${item.name}</h3>
                            <p>${item.addr}</p>
                            <img src="{{ site.baseurl }}/assets/images/${item.img}.png" style="width:100px;">
                        </div>
                     `);
                });
            })
            .catch(err => {
                console.warn("데이터 로드 중 문제 발생 (지도는 계속 유지됩니다):", err.message);
            });
    }

    // 페이지가 완전히 로드된 후 지도 실행
    window.onload = initMap;
</script>


    
    
</main>

{% include footer.html %}
