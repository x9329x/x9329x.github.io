<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

</head>
<body>

<style>
    #map-wrapper { width: 100%; height: 60%; }
    #map { width: 100%; height: 100%; }
    /* 마커 이미지 경로가 꼬일 때를 대비해 강제로 설정 */
    .leaflet-marker-icon { filter: hue-rotate(0deg); } 
</style>

<div id="map-wrapper">
    <div id="map"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    window.addEventListener('load', function() {
        var map = L.map('map').setView([35.15, 128.60], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        fetch('{{ site.baseurl }}/assets/places.json')
            .then(res => res.json())
            .then(data => {
                data.forEach(item => {
                    var lat = parseFloat(item.lat);
                    var lng = parseFloat(item.lng);
                    
                    // 이미지가 없으면 날짜를 '정보 없음'으로 처리
                    var dateDisplay = "날짜 정보 없음";
                    if (item.img && typeof item.img === 'string' && item.img.length >= 8) {
                        var dateStr = item.img.substring(0, 8);
                        dateDisplay = dateStr.substring(0, 4) + "." + dateStr.substring(4, 6) + ".";
                    }

                    if(!isNaN(lat) && !isNaN(lng)) {
                        L.marker([lat, lng]).addTo(map)
                         .bindPopup(`
                            <div style="text-align:center; min-width:150px;">
                                <div style="font-size: 11px; color: #555; margin-bottom:5px;">${dateDisplay}</div>
                                <b style="font-size: 14px;">${item.place || '이름 없음'}</b><br>
                                <img src="{{ site.baseurl }}/assets/images/${item.img}" 
                                     style="width:150px; margin-top:5px; border-radius:4px;"
                                     onerror="this.style.display='none'; this.nextSibling.innerHTML='이미지를 찾을 수 없습니다.';">
                                <div></div>
                            </div>
                         `);
                    }
                });
            })
            .catch(err => console.error("데이터 로드 중 에러:", err));
        
        setTimeout(() => { map.invalidateSize(); }, 500);
    });
</script>


    
</body>
</html>
