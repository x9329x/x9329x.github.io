---
layout: compress
---
{% include head.html %}

<main>
    {% include header.html %}

    <article>
        <h1>{{ page.title }}</h1>
        {{ content }}
    </article>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map {
            width: 100%;
            height: 600px;
            margin: 20px 0;
            border-radius: 8px;
            z-index: 1;
        }
        .popup-img {
            width: 100%;
            max-width: 200px;
            height: auto;
            display: block;
            margin-top: 5px;
        }
    </style>

    <div id="map"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 지도 초기화
            const map = L.map('map').setView([35.15, 128.60], 12);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // 마커 아이콘 설정
            const DefaultIcon = L.icon({
                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41]
            });
            L.Marker.prototype.options.icon = DefaultIcon;

            // 데이터 파일 읽기
            fetch('{{ site.baseurl }}/assets/js/places.json')
                .then(response => {
                    if (!response.ok) throw new Error("JSON 파일을 찾을 수 없습니다.");
                    return response.json();
                })
                .then(placeData => {
                    placeData.forEach(item => {
                        L.marker([item.lat, item.lng]).addTo(map)
                         .bindPopup(`
                            <div style="width: 150px;">
                                <b>${item.name}</b><br>${item.addr}<br>
                                <img src="{{ site.baseurl }}/assets/images/${item.img}.png" class="popup-img">
                            </div>
                         `);
                    });
                })
                .catch(err => console.warn("지도 데이터 로드 안됨:", err.message));
        });
    </script>
</main>

{% include footer.html %}
