<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

</head>
<body>
<div id="map" style="width:100%; height:600px; background-color:#e0e0e0; position:relative; z-index:0;"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 페이지가 완전히 로드된 후 지도를 그립니다.
    window.onload = function() {
        console.log("지도 로딩 시작...");
        
        var map = L.map('map').setView([35.15, 128.60], 12);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 데이터 로드 확인용 로그
        fetch('{{ site.baseurl }}/assets/places.json')
            .then(res => res.json())
            .then(data => {
                console.log("데이터 개수:", data.length);
                data.forEach(item => {
                    var lat = parseFloat(item.lat);
                    var lng = parseFloat(item.lng);
                    if(!isNaN(lat) && !isNaN(lng)) {
                        L.marker([lat, lng]).addTo(map).bindPopup("<b>" + (item.place || "위치") + "</b>");
                    }
                });
            })
            .catch(err => console.error("데이터 오류:", err));
    };
</script>

</body>
</html>
