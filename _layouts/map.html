---
layout: null
---
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

</head>
<body>



    <style>
    #map-wrapper { width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; }
    
    /* 팝업의 닫기 버튼(x) 숨기기 */
    .leaflet-popup-close-button { display: none !important; }
    
    .popup-content { text-align: center; min-width: 200px; }
    .popup-img { width: 200px; height: auto; margin: 10px 0; border-radius: 4px; }
    .popup-date { font-size: 12px; color: #666; }
    .popup-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
</style>

<div id="map-wrapper"><div id="map"></div></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    window.addEventListener('load', function() {
        var map = L.map('map').setView([35.15, 128.60], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        fetch('{{ site.baseurl }}/assets/places.json')
            .then(res => res.json())
            .then(data => {
                data.forEach(item => {
                    var lat = parseFloat(item.lat);
                    var lng = parseFloat(item.lng);
                    
                    // 날짜 추출 (YYYYMMDD 형식에서 YYYY.MM 추출)
                    var dateStr = item.img.substring(0, 8);
                    var dateDisplay = dateStr.substring(0, 4) + "." + dateStr.substring(4, 6);

                    // 장소명 우선, 없으면 주소 표시
                    var title = item.place ? item.place : item.address;

                    if(!isNaN(lat) && !isNaN(lng)) {
                        L.marker([lat, lng]).addTo(map)
                         .bindPopup(`
                            <div class="popup-content">
                                <div class="popup-date">${dateDisplay}</div>
                                <div class="popup-title">${title}</div>
                                <img src="{{ site.baseurl }}/assets/map_img/${item.img}" class="popup-img">
                                <div style="font-size:12px;">${item.address}</div>
                            </div>
                         `);
                    }
                });
            });
        
        setTimeout(() => { map.invalidateSize(); }, 500);
    });
</script>


    
</body>
</html>
