---
layout: compress
---

{% include head.html %}

<main>

    {% include header.html %}

    <article>
        <h1>{{ page.title }}</h1>
        {{ content }}
    </article>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map {
            width: 100%;
            height: 600px;
            z-index: 1;
        }
        .popup-img {
            width: 100%;
            max-width: 200px;
            height: auto;
            display: block;
            margin-top: 5px;
        }
    </style>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([37.5665, 126.9780], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const markerBounds = [];

        // site.data.places가 이제 첫 줄의 헤더를 Key값으로 인식합니다.
        {% for row in site.data.places %}
            // 영문 약자 헤더 매핑
            var latVal = parseFloat("{{ row.lat }}");
            var lngVal = parseFloat("{{ row.lng }}");
            var nameStr = "{{ row.place | escape }}";
            var addrStr = "{{ row.address | escape }}";
            var imgStr = "{{ row.img | escape }}";

            if (!isNaN(latVal) && !isNaN(lngVal)) {
                var marker = L.marker([latVal, lngVal]).addTo(map);
                
                var popupContent = `
                    <div>
                        <h3 style="margin: 0 0 5px 0; font-size: 16px;">${nameStr}</h3>
                        <p style="margin: 0 0 5px 0; font-size: 12px; color: #666;">${addrStr}</p>
                        ${imgStr ? `<img src="{{ site.baseurl }}/assets/images/${imgStr}" class="popup-img" alt="${nameStr}">` : ''}
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                markerBounds.push([latVal, lngVal]);
            }
        {% endfor %}

        if (markerBounds.length > 0) {
            map.fitBounds(markerBounds);
        }
    </script>
<br>반영되고 있는지</br>
    
</main>

{% include footer.html %}
