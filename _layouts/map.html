---
layout: compress
---

{% include head.html %}

<main>

    {% include header.html %}

    <article>
        <h1>{{ page.title }}</h1>
        {{ content }}
    </article>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map {
            width: 100%;
            height: 600px;
            z-index: 1;
        }
        .popup-img {
            width: 100%;
            max-width: 200px;
            height: auto;
            display: block;
            margin-top: 5px;
        }
    </style>

    <div id="map"></div>

    <script>
    // 지도 초기화 (창원시 중심으로 좌표 변경)
    const map = L.map('map').setView([35.15, 128.60], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 마커 아이콘 설정 (핀이 안 보일 때를 대비한 필수 설정)
    const DefaultIcon = L.icon({
        iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41]
    });
    L.Marker.prototype.options.icon = DefaultIcon;

    // 데이터 루프
    {% for row in site.data.places %}
        // 데이터를 가져와서 강제로 숫자로 변환
        var lat = parseFloat("{{ row['lat'] }}");
        var lng = parseFloat("{{ row['lng'] }}");
        var name = "{{ row['place'] | escape }}";
        var addr = "{{ row['address'] | escape }}";
        var img = "{{ row['img'] | escape }}";

        // 콘솔 확인용 (핀이 안 뜨면 F12 눌러서 콘솔에 찍히는 숫자를 확인하세요)
        console.log("위치:", lat, lng, name);

        if (!isNaN(lat) && !isNaN(lng)) {
            L.marker([lat, lng]).addTo(map)
             .bindPopup(`
                <div style="width: 150px;">
                    <b>${name}</b><br>${addr}<br>
                    <img src="{{ site.baseurl }}/assets/images/${img}.png" style="width:100%">
                </div>
            `);
        }
    {% endfor %}
</script>
<br>반영되고 있는지</br>
    
</main>

{% include footer.html %}
