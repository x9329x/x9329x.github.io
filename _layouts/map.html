---
layout: null
---
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 기본 레이아웃 */
        #map { width: 100%; height: 600px; background-color: #e0e0e0; }
        
        /* 모바일에서 세로로 길게 설정 */
        @media (max-width: 768px) {
            #map { height: 80vh; } 
        }

        /* 팝업 스타일 */
        .leaflet-popup-close-button { display: none !important; }
        .popup-content { text-align: center; min-width: 200px; padding: 5px; }
        .popup-img { width: 200px; height: auto; margin: 10px 0; border-radius: 4px; display: block; }
        .popup-date { font-size: 12px; color: #666; }
        .popup-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="map"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    window.onload = function() {
        var map = L.map('map').setView([35.15, 128.60], 12);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        fetch('{{ site.baseurl }}/assets/places.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                data.forEach(function(item) {
                    var lat = parseFloat(item.lat);
                    var lng = parseFloat(item.lng);
                    
                    if(!isNaN(lat) && !isNaN(lng)) {
                        // 날짜 추출 (파일명 8자리)
                        var dateStr = String(item.img).substring(0, 8);
                        var dateDisplay = dateStr.substring(0, 4) + "." + dateStr.substring(4, 6);
                        var title = item.place || item.address;

                        // 팝업 내용
                        var popupHtml = '<div class="popup-content">' +
                                        '<div class="popup-date">' + dateDisplay + '</div>' +
                                        '<div class="popup-title">' + title + '</div>' +
                                        '<img src="{{ site.baseurl }}/assets/map_img/' + item.img + '" class="popup-img" onerror="this.style.display=\'none\'">' +
                                        //'<div style="font-size:12px;">' + item.address + '</div>' +
                                        '</div>';

                        L.marker([lat, lng]).addTo(map).bindPopup(popupHtml);
                    }
                });
            })
            .catch(function(err) { console.error("데이터 오류:", err); });
            
        setTimeout(function() { map.invalidateSize(); }, 500);
    };
</script>

</body>
</html>
