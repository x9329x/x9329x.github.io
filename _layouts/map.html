<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

</head>
<body>

<style>
    #map-wrapper { width: 100%; height: 600px; }
    #map { width: 100%; height: 100%; }
    /* 마커 이미지 경로가 꼬일 때를 대비해 강제로 설정 */
    .leaflet-marker-icon { filter: hue-rotate(0deg); } 
</style>

<div id="map-wrapper">
    <div id="map"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    window.addEventListener('load', function() {
        var map = L.map('map').setView([35.15, 128.60], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        fetch('{{ site.baseurl }}/assets/places.json')
            .then(res => res.json())
            .then(data => {
                data.forEach(item => {
                    var lat = parseFloat(item.lat);
                    var lng = parseFloat(item.lng);
                    
                    // --- 날짜 정보 추출 로직 시작 ---
                    // item.img가 '20240127_...' 형태라고 가정
                    var dateStr = item.img.substring(0, 8); // '20240127'
                    var year = dateStr.substring(0, 4);     // '2024'
                    var month = dateStr.substring(4, 6);    // '01'
                    var dateDisplay = year + "년 " + month + "월";
                    // --- 날짜 정보 추출 끝 ---

                    if(!isNaN(lat) && !isNaN(lng)) {
                        L.marker([lat, lng]).addTo(map)
                         .bindPopup(`
                            <div style="text-align:center;">
                                <div style="font-size: 11px; color: #888;">${dateDisplay}</div>
                                <b style="font-size: 15px;">${item.place}</b><br>
                                <img src="{{ site.baseurl }}/assets/images/${item.img}" style="width:150px; margin-top:5px;">
                            </div>
                         `);
                    }
                });
            })
            .catch(err => console.error("데이터 로드 중 에러:", err));
        
        setTimeout(() => { map.invalidateSize(); }, 500);
    });
</script>


    
</body>
</html>
