---
layout: compress
---

{% include head.html %}

<main>

    {% include header.html %}

    <article>
        <h1>{{ page.title }}</h1>
        {{ content }}
    </article>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map {
            width: 100%;
            height: 600px;
            z-index: 1;
        }
        .popup-img {
            width: 100%;
            max-width: 200px;
            height: auto;
            display: block;
            margin-top: 5px;
        }
    </style>

<div id="map" style="width: 100%; height: 600px;"></div>

<script>
    // 1. 지도 초기화
    const map = L.map('map').setView([35.15, 128.60], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 2. 외부 JSON 파일 읽어오기
    // {{ site.baseurl }}를 사용해 파일 경로를 정확히 지정하세요
    fetch('{{ site.baseurl }}/assets/js/places.json')
        .then(response => response.json())
        .then(placeData => {
            // 데이터가 로드된 후 실행
            placeData.forEach(item => {
                L.marker([item.lat, item.lng]).addTo(map)
                 .bindPopup(`
                    <div>
                        <h3>${item.name}</h3>
                        <p>${item.addr}</p>
                        <img src="{{ site.baseurl }}/assets/images/${item.img}.png" style="width:100px;">
                    </div>
                 `);
            });
        })
        .catch(err => console.error("데이터 로드 실패:", err));
</script>



    
    
</main>

{% include footer.html %}
