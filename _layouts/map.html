<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

</head>
<body>

<style>
    #map-wrapper { width: 100%; height: 600px; position: relative; }
    #map { width: 100%; height: 100%; }
    .leaflet-popup-close-button { display: none !important; }
    .popup-content { text-align: center; min-width: 200px; padding: 5px; }
    .popup-img { width: 200px; height: auto; margin: 10px 0; border-radius: 4px; display: block; }
    .popup-date { font-size: 12px; color: #666; }
    .popup-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
</style>

<div id="map-wrapper"><div id="map"></div></div>

<script>
    (function() {
        var map = L.map('map').setView([35.15, 128.60], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        fetch('{{ site.baseurl }}/assets/places.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                data.forEach(function(item) {
                    var lat = parseFloat(item.lat);
                    var lng = parseFloat(item.lng);
                    
                    // 날짜 계산 (YYYYMMDD)
                    var dateStr = String(item.img).substring(0, 8);
                    var dateDisplay = dateStr.substring(0, 4) + "." + dateStr.substring(4, 6);
                    
                    // 팝업 내용 구성 (중복 제거)
                    var popupHtml = '<div class="popup-content">' +
                                    '<div class="popup-date">' + dateDisplay + '</div>' +
                                    '<div class="popup-title">' + (item.place || item.address) + '</div>' +
                                    '<img src="{{ site.baseurl }}/assets/map_img/' + item.img + '" class="popup-img" onerror="this.style.display=\'none\';">' +
                                    '</div>';

                    if(!isNaN(lat) && !isNaN(lng)) {
                        L.marker([lat, lng]).addTo(map).bindPopup(popupHtml);
                    }
                });
            })
            .catch(function(err) { console.log("데이터 로드 에러:", err); });
        
        setTimeout(function() { map.invalidateSize(); }, 500);
    })();
</script>
    

</body>
</html>
