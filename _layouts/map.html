<!DOCTYPE html>

<html>

<head>
<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 기본 레이아웃 */
        #map { width: 100%; height: 600px; background-color: #e0e0e0; }
        
        /* 모바일에서 세로로 길게 설정 */
        @media (max-width: 768px) {
            #map { height: 80vh; } 
        }

        /* 팝업 스타일 */
        .leaflet-popup-close-button { display: none !important; }
        .popup-content { text-align: center; min-width: 200px; padding: 5px; }
        .popup-img { width: 200px; height: auto; margin: 10px 0; border-radius: 4px; display: block; }
        .popup-date { font-size: 12px; color: #666; }
        .popup-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>

<body>

<div id="map"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 2. DOM이 완전히 로드된 후 지도 실행
    document.addEventListener("DOMContentLoaded", function() {
        var map = L.map('map').setView([35.15, 128.60], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // 3. 데이터 로드 (경로를 절대경로인 /assets/로 강제 지정)
        fetch('/assets/places.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                data.forEach(function(item) {
                    var lat = parseFloat(item.lat);
                    var lng = parseFloat(item.lng);
                    
                    if(!isNaN(lat) && !isNaN(lng)) {
                        // 날짜 및 팝업 구성
                        var dateStr = String(item.img).substring(0, 8);
                        var dateDisplay = dateStr.substring(0, 4) + "." + dateStr.substring(4, 6) + ".";
                        var title = item.place || item.address;

var marker = L.marker([lat, lng]).addTo(map);

// 팝업 내용(HTML)과 설정(Option)을 콤마(,)로 구분하여 순서대로 넣습니다.
marker.bindPopup(
    // 1번 인자: HTML 내용
    '<div style="text-align:center; min-width:160px;">' +
    '<div style="font-size:12px; color:#666;">' + dateDisplay + '</div>' +
    '<div style="font-weight:bold; font-size:16px; margin-bottom:5px;">' + title + '</div>' +
    '<img src="/assets/map_img/' + item.img + '" style="width:200px; margin:10px 0; border-radius:4px;" onerror="this.style.display=\'none\'">' +
    '<div style="font-size:12px;">' + item.address + '</div>' +
    '</div>', 
    
    // 2번 인자: 설정 객체 (여기서 autoPan 등을 제어)
    {
        autoPan: true,
        autoPanPadding: [20, 20],
        closeButton: false
    }
);
            .catch(function(err) { console.error("데이터 로드 에러:", err); });
    });
</script>
</body>

</html>
