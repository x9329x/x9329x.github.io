<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

</head>
<body>

    <style>
    #map-wrapper { width: 100%; height: 600px; position: relative; }
    #map { width: 100%; height: 100%; }
    .leaflet-popup-close-button { display: none !important; }
    .popup-content { text-align: center; min-width: 200px; }
    .popup-img { width: 200px; height: auto; margin: 10px 0; border-radius: 4px; }
    .popup-date { font-size: 12px; color: #666; }
    .popup-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
</style>

<div id="map-wrapper"><div id="map"></div></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    (function() {
        var map = L.map('map').setView([35.15, 128.60], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Jekyll 변수 노출 방지를 위해 fetch 경로를 상대경로로 명시
        fetch('/assets/places.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                data.forEach(function(item) {
                    var lat = parseFloat(item.lat);
                    var lng = parseFloat(item.lng);
                    var dateStr = String(item.img).substring(0, 8);
                    var dateDisplay = dateStr.substring(0, 4) + "." + dateStr.substring(4, 6);
                    var title = item.place ? item.place : item.address;

                    if(!isNaN(lat) && !isNaN(lng)) {
                        var marker = L.marker([lat, lng]).addTo(map);
                        marker.bindPopup(
                            '<div class="popup-content">' +
                                '<div class="popup-date">' + dateDisplay + '</div>' +
                                '<div class="popup-title">' + title + '</div>' +
                                '<img src="/assets/map_img/' + item.img + '" class="popup-img">' +
                                '<div style="font-size:12px;">' + item.address + '</div>' +
                            '</div>'
                        );
                    }
                });
            })
            .catch(function(err) { console.log("데이터 로드 실패:", err); });
        
        setTimeout(function() { map.invalidateSize(); }, 500);
    })();
</script>

</body>
</html>
