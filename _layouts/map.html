<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

</head>
<body>

<style>
    #map-wrapper { width: 100%; height: 600px; }
    #map { width: 100%; height: 100%; }
    /* 마커 이미지 경로가 꼬일 때를 대비해 강제로 설정 */
    .leaflet-marker-icon { filter: hue-rotate(0deg); } 
</style>

<div id="map-wrapper">
    <div id="map"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 3. 지도가 준비될 때까지 기다렸다가 실행
    window.addEventListener('load', function() {
        console.log("페이지 로드 완료, 지도 생성 시작");
        
        // 지도 객체 생성
        var map = L.map('map').setView([35.15, 128.60], 12);

        // 지도 타일 레이어
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

  
        
        // 5. 지도 크기 강제 재계산 (회색 화면 방지)
        setTimeout(() => { map.invalidateSize(); }, 500);
    });
</script>


    
</body>
</html>
